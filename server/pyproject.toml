[project]
name = "dcaas-onboarding"
version = "0.1.0"
description = "Server onboarding API for bare-metal Kubernetes cluster provisioning"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pynetbox>=7,<8",
    "hvac>=2,<3",
    "httpx>=0.28,<1",
    "kubernetes>=31,<33",
    "python-jose[cryptography]>=3.3,<4",
    "cachetools>=5,<6",
    "itsdangerous>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
